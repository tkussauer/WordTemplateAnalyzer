# Bewertungsschema fuer die Komplexitaet von Word-Vorlagen
#
# Punkte einer Vorlage = Summe ueber alle Kennzahlen (Wert x Gewicht).
# Die Groesse ergibt sich aus den Schwellen; Mindestgroessen heben die
# Einstufung an, sobald die Kennzahl einen Wert > 0 hat.
#
# Eine eigene Datei kann mit --konfiguration <datei> angegeben werden;
# sie muss nur die Werte enthalten, die abweichen sollen.

# Ab dieser Punktzahl gilt die Groesse (darunter: S)
schwelle.M=20
schwelle.L=50
schwelle.XL=100

# Gewichte (Punkte je Vorkommen)
gewicht.seiten=2
gewicht.abschnitte=2
gewicht.absaetze=0.05
gewicht.tabellen=2
gewicht.verschachtelte_tabellen=5
gewicht.bilder=1
gewicht.textfelder=2
gewicht.kopf_fusszeilen=1
gewicht.datenfelder=0.5
gewicht.bedingungen=4
gewicht.einbindungen=5
gewicht.formularfelder=2
gewicht.sonstige_felder=0.25
gewicht.feldverschachtelung=3
gewicht.inhaltssteuerelemente=1.5
gewicht.listen=1
gewicht.formatvorlagen=0.5
gewicht.schriftstile=1
gewicht.fussnoten=1
gewicht.textmarken=0.5
gewicht.eingebettete_objekte=5
gewicht.makros=15

# Mindestgroesse, sobald die Kennzahl vorkommt
mindestgroesse.makros=L
mindestgroesse.einbindungen=M
mindestgroesse.verschachtelte_tabellen=M
